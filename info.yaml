# Tiny Tapeout project information
project:
  title:        "Badminton Scorekeeper"
  author:       "Bianca Manganaan"
  discord:      "biankz"
  description:  "BWF rally-scoring badminton scorekeeper with deuce, cap, serve tracking and undo/redo"
  language:     "Verilog"
  clock_hz:     10000
  tiles:        "1x1"
  top_module:   "tt_um_badminton_scorekeeper"
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank.
pinout:
  # Inputs
  ui[0]: "BTN_POINT_A"
  ui[1]: "BTN_POINT_B"
  ui[2]: "BTN_UNDO"
  ui[3]: "BTN_NEXT"
  ui[4]: "TARGET_SEL0"
  ui[5]: "TARGET_SEL1"
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "SEG_A"
  uo[1]: "SEG_B"
  uo[2]: "SEG_C"
  uo[3]: "SEG_D"
  uo[4]: "SEG_E"
  uo[5]: "SEG_F"
  uo[6]: "SEG_G"
  uo[7]: "SEG_DP"

  # Bidirectional pins
  uio[0]: "DIGIT_EN0"
  uio[1]: "DIGIT_EN1"
  uio[2]: "DIGIT_EN2"
  uio[3]: "DIGIT_EN3"
  uio[4]: "SERVE_A"
  uio[5]: "SERVE_B"
  uio[6]: "GAME_POINT"
  uio[7]: "MATCH_OVER"

# Do not change!
yaml_version: 6
